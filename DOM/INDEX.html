<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Student Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="container">

        <h1 id="title">Student Manager</h1>

        <p id="message">Welcome to our student list.</p>

        <input
            id="studentInput"
            type="text"
            placeholder="Enter student name"
        >

        <button id="addBtn">Add Student</button>

        <button id="changeBtn">Change Title</button>

        <button id="colorBtn">Change Color</button>

        <button id="hideBtn">Hide Message</button>

        <button id="showBtn">Show Message</button>

        <ul id="studentList">

            <li class="student">Abebe</li>

            <li class="student">Ali</li>

            <li class="student">Sara</li>

        </ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
